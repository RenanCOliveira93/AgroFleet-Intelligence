# Broker de desenvolvimento/homologação. Autenticação + ACL obrigatórias (sem acesso anônimo).
# TLS: veja docs/GUIA_TECNICO.md (seção 11) (listener 8883 com certificados) — não habilitado neste compose local.
listener 1883
allow_anonymous false
password_file /tmp/passwd
acl_file /tmp/acl
persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Rajadas: o padrão do Mosquitto (max_queued_messages 1000 por cliente) descartou mensagens QoS 1 para o backend num
# teste de rajada sem ritmo (3465 de 3600 gravadas). Fila maior evita a perda nesse caso; NÃO garante entrega se o
# backend ficar fora do ar por muito tempo (ver docs/GUIA_TECNICO.md, seção 10).
max_queued_messages 100000
max_inflight_messages 100
